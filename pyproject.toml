[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "french-consolidation-presales-demo"
version = "0.1.0"
description = "Synthetic educational consolidation and presales demonstration"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
